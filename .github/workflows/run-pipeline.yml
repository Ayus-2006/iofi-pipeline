name: Run Freight Rate Pipeline

on:
  workflow_dispatch:      # lets you click "Run workflow" manually on GitHub
  # schedule:
  #   - cron: '0 6 * * 1' # optional: uncomment to run every Monday 6am UTC

jobs:
  build-report:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: AI lane rate lookup (Gemini deep research, falls back to offline anchor)
        working-directory: pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -n "$GEMINI_API_KEY" ]; then
            python ai_rate_lookup.py --refresh
          else
            echo "No GEMINI_API_KEY secret set -- using offline benchmark anchor instead."
            echo "Add a free key at https://aistudio.google.com/apikey and set it as the"
            echo "GEMINI_API_KEY repo secret for real web-search-grounded rate research."
            python anchor_benchmark_rates.py
          fi

      - name: Build report
        working-directory: pipeline
        run: python build_report_v2.py

      - name: Upload report as artifact
        uses: actions/upload-artifact@v4
        with:
          name: freight-report
          path: outputs/
