name: Run Freight Rate Pipeline

on:
  workflow_dispatch:      # lets you click "Run workflow" manually on GitHub
  # schedule:
  #   - cron: '0 6 * * 1' # optional: uncomment to run every Monday 6am UTC

jobs:
  build-report:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Anchor lane rates to realistic benchmark
        working-directory: pipeline
        run: python anchor_benchmark_rates.py
        # Replaces the old ai_rate_lookup.py (Groq/Grok) call, which was
        # coming back systematically too low on Suez/Panama/Cape-exposed
        # lanes -- especially USA (~$2-3.5k instead of the real ~$6-8k).
        # See pipeline/anchor_benchmark_rates.py for the route-exposure
        # multipliers. If you want the live LLM cross-check back, add
        # GROQ_API_KEY as a repo secret and swap this step for
        # `python ai_rate_lookup.py`, then re-check the USA numbers it
        # returns before trusting them.

      - name: Build report
        working-directory: pipeline
        run: python build_report_v2.py

      - name: Upload report as artifact
        uses: actions/upload-artifact@v4
        with:
          name: freight-report
          path: outputs/
